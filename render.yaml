services:
  # Backend Web Service
  - type: web
    name: reachinbox-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        fromService:
          type: web
          name: reachinbox-frontend
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MIN_EMAIL_DELAY_MS
        value: 2000
      - key: MAX_EMAILS_PER_HOUR
        value: 200

  # Frontend Static Site
  - type: web
    name: reachinbox-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: reachinbox-backend
          property: host
          path: /api

databases:
  - name: reachinbox-postgres
    plan: free
    databaseName: reachinbox_db
    user: reachinbox_user
